<section th:fragment="messageList" id="message-list" aria-labelledby="received-heading">
  <h2 id="received-heading">Received messages</h2>
  <button type="button"
      hx-get="/messages/fragment"
      hx-target="#message-list"
      hx-swap="outerHTML">Load Messages</button>
  <button type="button"
      hx-post="/messages/replay"
      hx-target="#message-list"
      hx-swap="outerHTML">Rewind</button>
  <p th:if="${replayRequested}" role="status">
    Rewind requested. Wait for the consumer to replay the retained messages, then click Load Messages.
  </p>
  <ul id="messages">
    <li th:each="message : ${messages}">
      <pre th:text="${message}"></pre>
    </li>
  </ul>
</section>
