<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafka message sender</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/ext/response-targets.js"></script>
</head>
<body>
  <main>
    <h1>Kafka messages</h1>

    <form id="message-form"
        hx-post="/messages"
        hx-target="#status"
        hx-target-4*="#status"
        hx-target-5*="#status"
        hx-swap="innerHTML"
        hx-ext="response-targets"
        hx-on::after-request="if (event.detail.successful) this.reset()">
      <label for="message">Message (JSON)</label>
      <textarea id="message" name="message" rows="8" required></textarea>
      <button type="submit">Send message</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>

    <div class="message-lists">
      <section th:replace="~{fragments/message-list :: messageList('consumer1', 'Consumer 1', ${consumer1Messages}, '/messages/fragment', '/messages/replay', false)}"></section>
      <section th:replace="~{fragments/message-list :: messageList('consumer2', 'Consumer 2', ${consumer2Messages}, '/messages/consumer2/fragment', '/messages/consumer2/replay', false)}"></section>
    </div>
  </main>
</body>
</html>
