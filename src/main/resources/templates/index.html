<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafka Stream Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles.css}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/ext/response-targets.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Kafka Stream Console home">
      <span class="brand-icon material-symbols-outlined" aria-hidden="true">hub</span>
      <span>KAFKA STREAM CONSOLE</span>
    </a>
    <div class="header-tools">
      <div class="header-badges">
        <span class="header-badge">
          <span class="status-dot" aria-hidden="true"></span>
          2 consumer groups
        </span>
        <span class="topic-badge">
          <span class="badge-label">TOPIC</span>
          <span th:text="${kafkaTopic}">thermostat_readings</span>
        </span>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
        <span class="material-symbols-outlined" id="theme-toggle-icon" aria-hidden="true">light_mode</span>
      </button>
    </div>
  </header>

  <main class="workbench">
    <div class="workbench-content">
      <div class="page-heading">
        <div class="page-title">
          <h1>Stream Workbench</h1>
          <span class="version-badge">LIVE</span>
        </div>
        <div class="refresh-indicator">
          <span class="status-dot" aria-hidden="true"></span>
          Messages refresh every second
        </div>
      </div>

      <section class="producer-panel" aria-labelledby="producer-heading">
        <div class="panel-heading">
          <div class="panel-title">
            <span class="material-symbols-outlined accent-icon" aria-hidden="true">send</span>
            <h2 id="producer-heading">Message producer</h2>
          </div>
          <span class="ready-badge"><span class="status-dot" aria-hidden="true"></span>Ready</span>
        </div>
        <div class="producer-content">
          <form id="message-form"
              class="producer-form"
              hx-post="/messages"
              hx-target="#status"
              hx-target-4*="#status"
              hx-target-5*="#status"
              hx-swap="innerHTML"
              hx-ext="response-targets"
              hx-on::after-request="if (event.detail.successful) this.reset()">
            <div class="message-field">
              <label class="visually-hidden" for="message">Message</label>
              <input id="message" name="message" type="text" placeholder="Type message string..." required>
            </div>
            <div class="recipient-field">
              <label for="recipient">Send to:</label>
              <select id="recipient" name="recipient" required>
                <option value="all" selected>All Consumers</option>
                <option value="consumer1">Consumer 1</option>
                <option value="consumer2">Consumer 2</option>
              </select>
            </div>
            <button class="send-button" type="submit">
              <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
              Send message
            </button>
          </form>
          <div class="producer-meta">
            <span><span class="meta-label">Format:</span> Plain String UTF-8</span>
            <div id="status" role="status" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <div class="message-lists">
        <section th:replace="~{fragments/message-list :: messageList('consumer1', 'Consumer 1', ${consumer1Messages}, '/messages/fragment', '/messages/replay', false)}"></section>
        <section th:replace="~{fragments/message-list :: messageList('consumer2', 'Consumer 2', ${consumer2Messages}, '/messages/consumer2/fragment', '/messages/consumer2/replay', false)}"></section>
      </div>
    </div>
  </main>
  <script>
    const themeToggle = document.getElementById("theme-toggle");
    const themeToggleIcon = document.getElementById("theme-toggle-icon");

    themeToggle.addEventListener("click", () => {
      const switchToLight = document.documentElement.dataset.theme !== "light";
      document.documentElement.dataset.theme = switchToLight ? "light" : "dark";
      themeToggleIcon.textContent = switchToLight ? "dark_mode" : "light_mode";
      themeToggle.setAttribute("aria-label", switchToLight ? "Switch to dark mode" : "Switch to light mode");
      themeToggle.title = switchToLight ? "Switch to dark mode" : "Switch to light mode";
    });
  </script>
</body>
</html>
